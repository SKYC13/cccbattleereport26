<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VUP-19 | Personnel Readiness</title>

  <style>
    :root {
      --bg: #06111d;
      --panel: #0d2236;
      --panel-hover: #122d46;
      --blue: #238fd1;
      --cyan: #68d6e9;
      --gold: #f2c75c;
      --green: #4bce94;
      --muted: #9eb4c5;
      --text: #eaf4fb;
      --border: #274965;
      --shadow: rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background-color: #06111d;
      background:
        radial-gradient(circle at 88% 3%, rgba(31, 129, 185, 0.16), transparent 26%),
        radial-gradient(circle at 10% 20%, rgba(104, 214, 233, 0.06), transparent 25%),
        var(--bg, #06111d);
    }

    .header {
      position: relative;
      min-height: 310px;
      overflow: hidden;
      border-bottom: 1px solid #315b7c;
      background:
        linear-gradient(112deg, rgba(3, 13, 26, 0.98) 0%, rgba(7, 30, 53, 0.96) 55%, rgba(9, 49, 79, 0.90) 100%);
    }
